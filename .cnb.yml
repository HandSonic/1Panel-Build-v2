# CNB uses the same immutable inputs and validation as GitHub.
# Build outputs remain pipeline artifacts until a reviewed publication step is enabled.
.build_stages: &build_stages
  - name: Resolve immutable inputs and test
    script: |
      set -eu
      apk add --no-cache bash python3 curl jq git
      version="${VERSION:-}"
      if [ -z "$version" ] && [ "${CNB_IS_TAG:-false}" = true ]; then version="$CNB_BRANCH"; fi
      version="${version:-v2.3.2}"
      arches=$(printf '%s' "${TARGET_ARCHES:-amd64 arm64 armv7 ppc64le s390x loong64 riscv64}" | tr ';,' ' ')
      for arch in $arches; do
        case "$arch" in amd64|arm64|armv7|ppc64le|s390x|loong64|riscv64) ;; *) exit 1;; esac
      done
      [ -n "$arches" ]
      python3 scripts/resolve_inputs.py "$version" > build-inputs.env
      python3 -m unittest discover -s tests -v
      echo "##[set-output BUILD_VERSION=$version]"
      echo "##[set-output BUILD_ARCHES=$arches]"
    exports:
      BUILD_VERSION: BUILD_VERSION
      BUILD_ARCHES: BUILD_ARCHES
  - name: Build requested architectures
    script: |
      set -eu
      bash -euo pipefail -c '
        source build-inputs.env
        docker build -f Dockerfile --build-arg VERSION="$BUILD_VERSION" \
          --build-arg TARGET_ARCHES="$BUILD_ARCHES" --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" \
          --build-arg INSTALLER_REF="$INSTALLER_REF" --build-arg GO_VERSION="$GO_VERSION" \
          --build-arg NODE_VERSION="$NODE_VERSION" --build-arg GEOIP_SHA256="$GEOIP_SHA256" \
          --build-arg BUILD_REPOSITORY_COMMIT="$CNB_COMMIT" -t "1panel-build:$CNB_COMMIT" .
        mkdir -p dist
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/dist:/dist" "1panel-build:$CNB_COMMIT"
        python3 scripts/validate_artifacts.py dist "$BUILD_VERSION" "$BUILD_ARCHES"
        cp build-inputs.env dist/build-inputs.env
      '
  - name: Preserve verified build artifacts
    image: cnbcool/attachments:latest
    settings:
      attachments:
        - dist/**
.build_pipeline: &build_pipeline
  - name: Build and verify 1Panel community
    runner:
      tags: cnb:arch:amd64
      cpus: 8
    docker:
      image: docker:24-dind
    services: [docker]
    stages: *build_stages
"v*":
  push: *build_pipeline
master:
  "crontab: 0 2 * * *": *build_pipeline
  web_trigger_build: *build_pipeline
main:
  "crontab: 0 2 * * *": *build_pipeline
  web_trigger_build: *build_pipeline
