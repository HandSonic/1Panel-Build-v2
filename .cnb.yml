# VERSION: upstream single tag/ref; empty resolves latest v2 release.
# TARGET_ARCHES: spaces, commas or semicolons; default is all supported targets.
# CNB deliberately retries builds: a Git tag is not proof of uploaded assets.
# Both providers share version, fingerprint, build and local verification logic.
.build_stages: &build_stages
  - name: Resolve Build Inputs
    script: |
      set -e
      apk add --no-cache bash python3 curl jq git
      CI_PROVIDER=cnb bash scripts/ci_build.sh prepare
    exports:
      VERSION: VERSION
      ARCH_LIST: ARCH_LIST
      GO_VERSION: GO_VERSION
      NODE_VERSION: NODE_VERSION
      CHANNEL: CHANNEL
      INSTALLER_REF: INSTALLER_REF
      BUILD_FINGERPRINT: BUILD_FINGERPRINT

  - name: Build Docker Image
    script: CI_PROVIDER=cnb bash scripts/ci_build.sh build
    exports:
      IMAGE_TAG: IMAGE_TAG

  - name: Export and Verify Artifacts
    script: bash scripts/ci_build.sh export

  - name: Create Tag Only If Missing
    script: bash scripts/ci_build.sh ensure-tag

  - name: Create CNB Release
    type: git:release
    options:
      tag: ${VERSION}
      title: ${VERSION}
      description: "Source build; requested: ${ARCH_LIST}. Only architectures marked built in build-manifest.json are available; skipped targets will be retried on the next run."
      overlying: true

  - name: Upload Verified Packages to CNB Release
    image: cnbcool/attachments:latest
    settings:
      tag: ${VERSION}
      attachments:
        - dist/*.tar.gz
        - dist/*.sha256

  # The completion record is uploaded only after the package stage succeeds.
  - name: Upload Build Manifest to CNB Release
    image: cnbcool/attachments:latest
    settings:
      tag: ${VERSION}
      attachments:
        - dist/build-manifest.json

.build_pipeline: &build_pipeline
  - name: Build 1Panel v2 from source
    runner:
      tags: cnb:arch:amd64
      cpus: 8
    docker:
      image: docker:24-dind
    services:
      - docker
    stages: *build_stages

"v*":
  push: *build_pipeline

master:
  "crontab: 0 2 * * *": *build_pipeline
  web_trigger_build: *build_pipeline

main:
  "crontab: 0 2 * * *": *build_pipeline
  web_trigger_build: *build_pipeline
