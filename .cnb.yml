# CNB uses the same immutable inputs and validation as GitHub.
# Build outputs remain pipeline artifacts until a reviewed publication step is enabled.
.build_stages: &build_stages
  - name: Resolve immutable inputs and test
    script: |
      set -eu
      rm -f -- cnb-verified-artifacts
      apk add --no-cache bash python3 py3-pip curl jq git nodejs npm
      python3 -m venv /tmp/build-python
      . /tmp/build-python/bin/activate
      python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      version="${VERSION:-}"
      if [ -z "$version" ] && [ "${CNB_IS_TAG:-false}" = true ]; then version="$CNB_BRANCH"; fi
      if [ -z "$version" ]; then version=$(python3 scripts/discover_inputs.py --latest --mode "${CHANNEL:-stable}"); fi
      arches="${TARGET_ARCHES:-amd64 arm64 armv7 ppc64le s390x loong64 riscv64}"
      arches=$(python3 -c 'import sys;sys.path.insert(0,"scripts");from validate_artifacts import architectures;print(" ".join(architectures(sys.argv[1])))' "$arches")
      contract_sha=$(python3 scripts/discover_inputs.py --version "$version" --output resolved-source.json)
      python3 scripts/resolved_contract.py apply resolved-source.json "$version" --sha256 "$contract_sha"
      python3 scripts/resolve_inputs.py "$version" > build-inputs.env
      python3 -m unittest discover -s tests -v
      echo "##[set-output BUILD_VERSION=$version]"
      echo "##[set-output BUILD_ARCHES=$arches]"
    exports:
      BUILD_VERSION: BUILD_VERSION
      BUILD_ARCHES: BUILD_ARCHES
  - name: Build requested architectures
    script: |
      set -eu
      . /tmp/build-python/bin/activate
      bash scripts/build_cnb_matrix.sh
  - &preserve_artifacts
    name: Preserve verified build artifacts
    if: test -n "${CNB_BUILD_ID:-}" && test -n "${CNB_PIPELINE_ID:-}" && test "$(cat cnb-verified-artifacts 2>/dev/null)" = "$CNB_BUILD_ID:$CNB_PIPELINE_ID:$CNB_COMMIT"
    image: cnbcool/attachments:latest
    settings:
      attachments:
        - dist/**
.build_pipeline: &build_pipeline
  - name: Build and verify 1Panel community
    runner:
      tags: cnb:arch:amd64
      cpus: 8
    docker:
      image: docker:24-dind
    services: [docker]
    stages: *build_stages
    failStages:
      - *preserve_artifacts
"v*":
  tag_push: *build_pipeline
master:
  "crontab: 0 2 * * *": *build_pipeline
  web_trigger_build: *build_pipeline
main:
  "crontab: 0 2 * * *": *build_pipeline
  web_trigger_build: *build_pipeline
