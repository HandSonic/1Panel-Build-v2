# 手动触发按钮配置
branch:
  # 所有分支都显示此按钮
  - buttons:
      - name: 编译1Panel
        description: 从源码编译 1Panel ${VERSION}
        event: web_trigger_build
        isDefault: true
        env:
          # 手动触发时强制构建
          FORCE_BUILD: "1"
        inputs:
          VERSION:
            name: 1Panel版本
            description: 指定已审核的版本号，留空使用已审核默认版本 v2.3.2
            placeholder: 如 v2.3.2；历史版本必须有对应审核输入锁
            type: input
            required: false
          TARGET_ARCHES:
            name: 目标架构
            description: 选择要编译的CPU架构
            type: select
            multiple: true
            default: amd64,arm64,armv7,ppc64le,s390x,loong64,riscv64
            options:
              - name: AMD64 (x86_64)
                value: amd64
              - name: ARM64 (aarch64)
                value: arm64
              - name: ARMv7
                value: armv7
              - name: PPC64LE
                value: ppc64le
              - name: S390X
                value: s390x
              - name: LoongArch64
                value: loong64
              - name: RISC-V 64
                value: riscv64
