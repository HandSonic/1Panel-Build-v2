name: build-offline
permissions:
  contents: read
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed upstream version from config/sources.json'
        default: 'v2.3.2'
      arch:
        description: 'Architectures (space or comma separated)'
        default: 'amd64 arm64 armv7 ppc64le s390x loong64 riscv64'
      publish_candidate:
        type: boolean
        description: 'Create a new draft candidate after verification; never replace public assets'
        default: false
  schedule:
    - cron: '0 7 * * *'
concurrency:
  group: upstream-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      arches: ${{ steps.inputs.outputs.arches }}
    permissions:
      contents: read
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_ARCHES: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable build inputs
        id: inputs
        run: |
          set -euo pipefail
          version=${INPUT_VERSION:-}
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/* ]]; then version=$GITHUB_REF_NAME; fi
          version=${version:-v2.3.2}
          [[ "$version" =~ ^v2\.[0-9]+\.[0-9]+(-(alpha|beta|dev)\.[0-9]+)?$ ]]
          arches=$(printf '%s' "${INPUT_ARCHES:-amd64 arm64 armv7 ppc64le s390x loong64 riscv64}" | tr ',;' ' ')
          for arch in $arches; do
            case "$arch" in amd64|arm64|armv7|ppc64le|s390x|loong64|riscv64) ;; *) exit 1;; esac
          done
          [[ -n "$arches" ]]
          python3 scripts/resolve_inputs.py "$version" > build-inputs.env
          printf 'VERSION=%s\nTARGET_ARCHES=%s\n' "$version" "$arches" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"
      - name: Build and validate every requested architecture
        run: |
          set -euo pipefail
          source build-inputs.env
          docker build -f Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg TARGET_ARCHES="$TARGET_ARCHES" \
            --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" --build-arg INSTALLER_REF="$INSTALLER_REF" \
            --build-arg GO_VERSION="$GO_VERSION" --build-arg NODE_VERSION="$NODE_VERSION" \
            --build-arg GEOIP_SHA256="$GEOIP_SHA256" --build-arg BUILD_REPOSITORY_COMMIT="$GITHUB_SHA" \
            -t "1panel-v2-builder:$GITHUB_SHA" .
          mkdir -p dist
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/dist:/dist" "1panel-v2-builder:$GITHUB_SHA"
          python3 scripts/validate_artifacts.py dist "$VERSION" "$TARGET_ARCHES"
          cp build-inputs.env dist/build-inputs.env
      - uses: actions/upload-artifact@v4
        with:
          name: verified-1panel-${{ steps.inputs.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  candidate:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      TARGET_ARCHES: ${{ needs.build.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-1panel-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Revalidate candidate artifact
        run: python3 scripts/validate_artifacts.py dist "$VERSION" "$TARGET_ARCHES"
      - name: Stage a new draft candidate and verify downloaded bytes
        run: |
          set -euo pipefail
          tag="$VERSION-build-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Candidate already exists; refusing overwrite.'; exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$tag" \
            --notes 'Build candidate only. All requested architectures validated; pending promotion and downstream regression.'
          gh release upload "$tag" dist/*
          mkdir remote-readback
          gh release download "$tag" --dir remote-readback
          python3 scripts/validate_artifacts.py remote-readback "$VERSION" "$TARGET_ARCHES"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          local={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('dist').iterdir() if p.is_file()}
          remote={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('remote-readback').iterdir() if p.is_file()}
          if local != remote: raise SystemExit('Remote readback differs from validated output')
          PY
