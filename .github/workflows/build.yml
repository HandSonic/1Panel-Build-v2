name: build-offline
permissions:
  contents: read
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version, or leave empty to discover the official channel release'
        default: ''
      channel:
        type: choice
        options: [stable, beta, dev]
        default: stable
        description: 'Official channel for automatic discovery'
      arch:
        description: 'Requested architectures; each successful branch is independently validated'
        default: 'amd64 arm64 armv7 ppc64le s390x loong64 riscv64'
      operation:
        type: choice
        options: [build, build-only, validate-automatic, validate-promotion, promote-existing]
        default: build
        description: Normal build/publication, artifact-only build, read-only validation, or exact verified-CI promotion and draft recovery
      upstream_run_id:
        description: Exact verified build run ID; publication may have failed
        default: ''
      upstream_artifact_id:
        description: Exact artifact ID from that run
        default: ''
      upstream_artifact_sha256:
        description: Exact artifact ZIP SHA-256
        default: ''
      upstream_build_commit:
        description: Exact built commit from manifests, possibly a PR merge commit
        default: ''
      publish_candidate:
        type: boolean
        description: 'Create a new draft candidate after verification; never replace public assets'
        default: false
  schedule:
    - cron: '0 8 * * *'
concurrency:
  # Read-only builds/validation may overlap without replacing another pending run.
  group: upstream-run-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  check_update:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      arches: ${{ steps.check.outputs.arches }}
      build_required: ${{ steps.check.outputs.build_required }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version and missing architecture packages
        id: check
        run: |
          set -euo pipefail
          python3 scripts/scheduled_release.py --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
  tests:
    needs: check_update
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check_update.outputs.build_required == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.scope.outputs.build_required }}
    steps:
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: python3 -m unittest discover -s tests -v
      - name: Select integration scope
        id: scope
        run: |
          set -euo pipefail
          required=$(python3 scripts/ci_scope.py)
          [[ "$required" == true || "$required" == false ]]
          echo "build_required=$required" >> "$GITHUB_OUTPUT"
  prepare:
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.tests.outputs.build_required == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build' || inputs.operation == 'build-only' || inputs.operation == 'validate-automatic') }}
    needs: [check_update, tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      arches: ${{ steps.inputs.outputs.arches }}
      matrix: ${{ steps.inputs.outputs.matrix }}
      go_version: ${{ steps.inputs.outputs.go_version }}
      resolved_contract_sha256: ${{ steps.inputs.outputs.resolved_contract_sha256 }}
      source_sha256: ${{ steps.prepare.outputs.sha256 }}
      artifact_id: ${{ steps.source_upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_CHANNEL: ${{ inputs.channel || 'stable' }}
      INPUT_ARCHES: ${{ inputs.arch }}
      SCHEDULED_VERSION: ${{ needs.check_update.outputs.version }}
      SCHEDULED_ARCHES: ${{ needs.check_update.outputs.arches }}
    steps:
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Resolve immutable build inputs
        id: inputs
        run: |
          set -euo pipefail
          version=${INPUT_VERSION:-}
          requested=${INPUT_ARCHES:-amd64 arm64 armv7 ppc64le s390x loong64 riscv64}
          if [[ "${GITHUB_EVENT_NAME:-}" == schedule ]]; then
            version=${SCHEDULED_VERSION:?Missing scheduled version}
            requested=${SCHEDULED_ARCHES:?Missing scheduled architectures}
          fi
          arches=$(printf '%s' "$requested" | tr ',;' ' ')
          for arch in $arches; do
            case "$arch" in amd64|arm64|armv7|ppc64le|s390x|loong64|riscv64) ;; *) exit 1;; esac
          done
          [[ -n "$arches" ]]
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/* ]]; then version=$GITHUB_REF_NAME; fi
          if [[ -z "$version" ]]; then
            version=$(python3 scripts/discover_inputs.py --latest --mode "$INPUT_CHANNEL")
          fi
          matrix=$(python3 -c 'import json,sys;sys.path.insert(0,"scripts");from validate_artifacts import architectures;print(json.dumps({"arch":architectures(sys.argv[1])}))' "$arches")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          contract_sha=$(python3 scripts/discover_inputs.py --version "$version" --output resolved-source.json)
          python3 scripts/resolved_contract.py apply resolved-source.json "$version" --sha256 "$contract_sha"
          echo "resolved_contract_sha256=$contract_sha" >> "$GITHUB_OUTPUT"
          python3 scripts/resolve_inputs.py "$version" > build-inputs.env
          source build-inputs.env
          printf 'VERSION=%s\nTARGET_ARCHES=%s\n' "$version" "$arches" >> "$GITHUB_ENV"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare pinned source and frontend once
        id: prepare
        run: |
          set -euo pipefail
          source build-inputs.env
          docker build -f Dockerfile --target prepared-builder \
            --build-arg VERSION="$VERSION" --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" \
            --build-arg INSTALLER_REF="$INSTALLER_REF" --build-arg GO_VERSION="$GO_VERSION" \
            --build-arg NODE_VERSION="$NODE_VERSION" --build-arg GEOIP_SHA256="$GEOIP_SHA256" \
            --build-arg BUILD_REPOSITORY_COMMIT="$GITHUB_SHA" -t "1panel-prepared:$GITHUB_SHA" .
          container=$(docker create "1panel-prepared:$GITHUB_SHA" true)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/opt/1Panel" prepared-source
          sudo chown -R "$(id -u):$(id -g)" prepared-source
          test -s prepared-source/core/cmd/server/web/index.html
          test "$(git -C prepared-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          extra=()
          if [[ -f resolved-source.json ]]; then extra+=(resolved-source.json); fi
          if [[ -f resolved-frontend-package-lock.json ]]; then extra+=(resolved-frontend-package-lock.json); fi
          tar -czf prepared-source.tar.gz prepared-source build-inputs.env "${extra[@]}"
          echo "sha256=$(sha256sum prepared-source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: source_upload
        with:
          name: prepared-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared-source.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  compile:
    name: compile (${{ matrix.arch }})
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCHES: ${{ matrix.arch }}
      BUILD_REPOSITORY_COMMIT: ${{ github.sha }}
      GOTOOLCHAIN: local
      PREPARED_SHA256: ${{ needs.prepare.outputs.source_sha256 }}
      RESOLVED_CONTRACT_SHA256: ${{ needs.prepare.outputs.resolved_contract_sha256 }}
    steps:
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify shared source before use
        run: |
          set -euo pipefail
          echo "$PREPARED_SHA256  prepared-source.tar.gz" | sha256sum -c -
          tar -xzf prepared-source.tar.gz
          if [[ -n "$RESOLVED_CONTRACT_SHA256" ]]; then
            python3 scripts/resolved_contract.py apply resolved-source.json "$VERSION" --sha256 "$RESOLVED_CONTRACT_SHA256"
          elif [[ -e resolved-source.json ]]; then
            echo "Unexpected generated source contract"; exit 1
          fi
          source build-inputs.env
          test "$(git -C prepared-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/resolve_inputs.py "$VERSION" | cmp - build-inputs.env
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.prepare.outputs.go_version }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: upstream-${{ runner.os }}-${{ needs.prepare.outputs.version }}-go${{ needs.prepare.outputs.go_version }}-${{ matrix.arch }}-${{ hashFiles('prepared-source/core/go.mod', 'prepared-source/core/go.sum', 'prepared-source/agent/go.mod', 'prepared-source/agent/go.sum', 'scripts/go_arch_compat.py') }}
      - name: Verify SQLite compatibility on native and loong64 engines
        if: matrix.arch == 'loong64'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user
          python3 scripts/verify_go_sqlite_compat.py prepared-source --qemu qemu-loongarch64
      - name: Build and validate every requested architecture
        run: |
          set -euo pipefail
          source build-inputs.env
          test "$(go env GOVERSION)" = "go$GO_VERSION"
          tools="$PWD/scripts"
          (cd prepared-source; bash "$tools/build_release.sh")
          cp build-inputs.env prepared-source/dist/build-inputs.env
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.arch }}-${{ github.run_id }}-${{ needs.prepare.outputs.artifact_id }}
          # A failed-only rerun replaces just its own intermediate shard.
          overwrite: true
          path: prepared-source/dist/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  build:
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: [prepare, compile]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      arches: ${{ needs.prepare.outputs.arches }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCHES: ${{ needs.prepare.outputs.arches }}
      BUILD_REPOSITORY_COMMIT: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      PRODUCER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SHARD_GENERATION: ${{ github.run_id }}-${{ needs.prepare.outputs.artifact_id }}
      RESOLVED_CONTRACT_SHA256: ${{ needs.prepare.outputs.resolved_contract_sha256 }}
    steps:
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*-${{ github.run_id }}-${{ needs.prepare.outputs.artifact_id }}
          path: shards
      - name: Independently validate and aggregate all architecture shards
        run: |
          set -euo pipefail
          python3 scripts/aggregate_shards.py shards dist "$VERSION" "$TARGET_ARCHES" "$SHARD_GENERATION"
          python3 scripts/resolved_contract.py activate dist "$VERSION"
      - uses: actions/upload-artifact@v4
        id: bundle
        with:
          name: verified-1panel-${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
  candidate:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.operation == 'build' && inputs.publish_candidate }}
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-candidate-${{ github.repository }}-${{ needs.build.outputs.version }}-${{ github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      TARGET_ARCHES: ${{ needs.build.outputs.arches }}
    steps:
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-1panel-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Revalidate candidate artifact
        run: |
          python3 scripts/resolved_contract.py activate dist "$VERSION"
          python3 scripts/validate_artifacts.py dist "$VERSION" "$(python3 -c 'import json; print(" ".join(r["architecture"] for r in json.load(open("dist/build-manifest.json"))["artifacts"]))')"
      - name: Stage a new draft candidate and verify downloaded bytes
        run: |
          set -euo pipefail
          tag="$VERSION-build-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          python3 scripts/candidate_publication.py --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" --tag "$tag" --target "$GITHUB_SHA" \
            --input dist --control candidate-control
      - name: Preserve candidate publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-control/
          if-no-files-found: warn
          retention-days: 90

  publication_prepare:
    needs: [tests, build]
    permissions:
      contents: read
      actions: read
    if: ${{ !cancelled() && needs.tests.result == 'success' && ((github.event_name == 'workflow_dispatch' && (inputs.operation == 'validate-promotion' || inputs.operation == 'promote-existing')) || (((github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'build' && !inputs.publish_candidate)) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'validate-automatic')) && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
      version: ${{ inputs.version || needs.build.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version || needs.build.outputs.version }}
      RELEASE_TAG: ${{ inputs.version }}
      PUBLICATION_OPERATION: ${{ inputs.operation || 'build' }}
      PUBLISH_CANDIDATE: ${{ inputs.publish_candidate && 'true' || 'false' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      UPSTREAM_SOURCE: verified-ci
      UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
      UPSTREAM_ARTIFACT_ID: ${{ inputs.upstream_artifact_id }}
      UPSTREAM_ARTIFACT_SHA256: ${{ inputs.upstream_artifact_sha256 }}
      UPSTREAM_BUILD_COMMIT: ${{ inputs.upstream_build_commit }}
    steps:
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.operation != 'validate-promotion' && inputs.operation != 'promote-existing'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: automatic-input
          merge-multiple: true
      - name: Prepare normal automatic canonical publication
        if: inputs.operation != 'validate-promotion' && inputs.operation != 'promote-existing'
        run: |
          python3 scripts/automatic_publication.py prepare --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" --input automatic-input --work publication-work
      - name: Validate selected inputs and prepare the complete contract
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'validate-promotion' || inputs.operation == 'promote-existing')
        run: |
          RELEASE_TAG=${RELEASE_TAG:-$VERSION}
          python3 scripts/manual_publication.py prepare \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "$RELEASE_TAG" --work publication-work \
            --upstream-source "$UPSTREAM_SOURCE" --run-id "$UPSTREAM_RUN_ID" --artifact-id "$UPSTREAM_ARTIFACT_ID" \
            --artifact-sha256 "$UPSTREAM_ARTIFACT_SHA256" --build-commit "$UPSTREAM_BUILD_COMMIT"
      - name: Bind the exact validation receipt
        id: receipt
        run: |
          receipt_sha=$(sha256sum publication-work/control/release-validation.json | cut -d' ' -f1)
          echo "sha256=$receipt_sha" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_RELEASE_RECEIPT_SHA256=$receipt_sha"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: verified-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-work/release/
            publication-work/control/
          if-no-files-found: error
          retention-days: 14
      - name: Upload small publication control evidence
        uses: actions/upload-artifact@v4
        with:
          name: publication-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-work/control/release-validation.json
            publication-work/release/checksums.txt
            publication-work/release/build-manifest.json
            publication-work/release/build-inputs.env
            publication-work/release/resolved-source.json
            publication-work/release/resolved-frontend-package-lock.json
          if-no-files-found: error
          retention-days: 14
  publication_repair:
    if: ${{ !cancelled() && needs.publication_prepare.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.operation == 'promote-existing' }}
    needs: publication_prepare
    runs-on: ubuntu-latest
    # Every ref repairing the same canonical tag shares one writer; other tags overlap.
    concurrency:
      group: upstream-release-${{ github.repository }}-${{ inputs.version }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.version }}
      PUBLICATION_OPERATION: ${{ inputs.operation }}
      EXPECTED_VALIDATION_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
    steps:
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_prepare.outputs.artifact_id }}
          path: publication-work
          merge-multiple: true
      - name: Revalidate and publish missing assets without backups
        run: |
          RELEASE_TAG=${RELEASE_TAG:-$VERSION}
          python3 scripts/manual_publication.py publish \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "$RELEASE_TAG" --work publication-work
      - name: Preserve publication journal on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-work/control/
          if-no-files-found: warn
          retention-days: 90

  automatic_publication:
    needs: publication_prepare
    if: ${{ !cancelled() && needs.publication_prepare.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'build' && !inputs.publish_candidate)) }}
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-release-${{ github.repository }}-${{ needs.publication_prepare.outputs.version }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.publication_prepare.outputs.version }}
      PUBLICATION_OPERATION: ${{ inputs.operation || 'build' }}
      PUBLISH_CANDIDATE: ${{ inputs.publish_candidate && 'true' || 'false' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_VALIDATION_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up isolated configuration parser
        run: |
          python3 -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python3" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_prepare.outputs.artifact_id }}
          path: publication-work
          merge-multiple: true
      - name: Create or append verified canonical artifacts
        run: |
          python3 scripts/automatic_publication.py publish --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" --work publication-work
      - name: Preserve automatic publication recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-work/control/
          if-no-files-found: warn
          retention-days: 90
