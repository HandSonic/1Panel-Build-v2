name: build-offline

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "1Panel tag/ref (single name without '/'); empty resolves latest v2 release"
        required: false
        default: ""
      arch:
        description: "Architectures separated by spaces, commas or semicolons"
        required: false
        default: "amd64 arm64 armv7 ppc64le s390x loong64 riscv64"
      force_build:
        description: "Rebuild even when matching artifacts are already complete"
        type: boolean
        default: false
      channel:
        description: "Optional runtime channel override: stable, beta or dev"
        required: false
        default: ""
      installer_ref:
        description: "Optional installer branch/tag/commit; default v2"
        required: false
        default: ""
  schedule:
    - cron: "0 7 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      DEFAULT_GO_VERSION: "1.25.7"
      NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
      GO_VERSION: ${{ vars.GO_VERSION }}
      CHANNEL: ${{ inputs.channel || vars.CHANNEL }}
      INSTALLER_REF: ${{ inputs.installer_ref || vars.INSTALLER_REF }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream version and build inputs
        id: vars
        env:
          VERSION_INPUT: ${{ inputs.version }}
          ARCH_INPUT: ${{ inputs.arch }}
        run: bash scripts/ci_build.sh prepare
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      arch_list: ${{ steps.vars.outputs.ARCH_LIST }}
      arch_label: ${{ steps.vars.outputs.ARCH_LABEL }}
      go_version: ${{ steps.vars.outputs.GO_VERSION }}
      node_version: ${{ steps.vars.outputs.NODE_VERSION }}
      channel: ${{ steps.vars.outputs.CHANNEL }}
      installer_ref: ${{ steps.vars.outputs.INSTALLER_REF }}
      fingerprint: ${{ steps.vars.outputs.BUILD_FINGERPRINT }}
      refs_resolved: ${{ steps.vars.outputs.REFS_RESOLVED }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: build-release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH_LIST: ${{ needs.prepare.outputs.arch_list }}
      ARCH_LABEL: ${{ needs.prepare.outputs.arch_label }}
      GO_VERSION: ${{ needs.prepare.outputs.go_version }}
      NODE_VERSION: ${{ needs.prepare.outputs.node_version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      INSTALLER_REF: ${{ needs.prepare.outputs.installer_ref }}
      BUILD_FINGERPRINT: ${{ needs.prepare.outputs.fingerprint }}
      REFS_RESOLVED: ${{ needs.prepare.outputs.refs_resolved }}
      FORCE_BUILD: ${{ inputs.force_build && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest and requested release assets
        id: check
        run: python3 scripts/release_build.py check
      - name: Build requested architectures
        if: steps.check.outputs.build == '1'
        run: bash scripts/ci_build.sh build
      - name: Export and verify artifacts
        if: steps.check.outputs.build == '1'
        run: bash scripts/ci_build.sh export
      - name: Preserve verified artifacts
        if: steps.check.outputs.build == '1'
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-${{ env.VERSION }}-${{ env.ARCH_LABEL }}
          path: dist/*
          if-no-files-found: error
      - name: Create release tag only if missing
        if: steps.check.outputs.build == '1'
        run: bash scripts/ci_build.sh ensure-tag
      - name: Upload, verify and publish release
        if: steps.check.outputs.build == '1'
        run: python3 scripts/release_build.py publish
